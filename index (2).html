<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e8541c">
<title>Minha Rota</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{--bg:#f6f4f1;--card:#fff;--ink:#1d1b19;--mut:#6f6a64;--acc:#e8541c;--ok:#1f9d55;--line:#e7e2dc;--waze:#33ccff}
  *{box-sizing:border-box}
  html{background:#2d2a27}
  body{margin:0 auto;max-width:480px;min-height:100vh;font-family:system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);box-shadow:0 0 30px rgba(0,0,0,.35)}
  .modal .sheet{max-width:480px}
  .top{position:sticky;top:0;z-index:5;background:var(--acc);color:#fff;padding:12px 14px 0}
  .top h1{margin:0;font-size:19px;display:flex;justify-content:space-between;align-items:center}
  .top h1 button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:13px}
  .kpis{display:flex;gap:8px;margin:10px 0}
  .kpi{flex:1;background:rgba(255,255,255,.16);border-radius:10px;padding:7px;text-align:center}
  .kpi b{display:block;font-size:19px}.kpi small{font-size:11px;opacity:.9}
  .tabs{display:flex}
  .tabs button{flex:1;background:none;border:0;color:#fff;opacity:.75;padding:10px;font-weight:700;font-size:15px;border-bottom:3px solid transparent}
  .tabs button.on{opacity:1;border-color:#fff}
  .wrap{max-width:480px;margin:0 auto;padding:10px 12px 170px}
  #map{height:62vh;border-radius:14px;border:1px solid var(--line);display:none;margin-top:6px}
  .pin{background:var(--acc);color:#fff;border:2px solid #fff;border-radius:50%;width:28px!important;height:28px!important;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
  .pin.me{background:#2563eb}.pin.nf{background:#999}
  .act.wz{background:var(--waze);color:#05384a}.act.gr{background:#e9e6e1;color:#333}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  .act{padding:13px 8px;border-radius:12px;border:0;font-weight:700;font-size:14px;background:#2d2a27;color:#fff}
  .act.main{background:var(--ok)}
  .msg{background:#fff3ec;border:1px solid #f6c9b3;border-radius:12px;padding:11px;font-size:14px;margin:8px 0;display:none;line-height:1.4}
  .stop{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:9px 0}
  .stop.next{border:2px solid var(--acc);box-shadow:0 2px 10px rgba(232,84,28,.15)}
  .hd{display:flex;gap:10px;align-items:flex-start}
  .num{flex:0 0 34px;height:34px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
  .stop.nf .num{background:#999}
  .addr{font-weight:700;font-size:16px;line-height:1.3}
  .meta{color:var(--mut);font-size:13px;margin-top:3px}
  .tag{display:inline-block;background:#fde7dc;color:#a8380c;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:800;margin-top:5px}
  .warn{display:inline-block;background:#fff4cc;color:#7a5a00;border-radius:999px;padding:2px 9px;font-size:12px;margin-top:5px}
  .pk{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);padding:5px 0;border-top:1px dashed var(--line);margin-top:6px}
  .code{font-family:ui-monospace,monospace;background:#f1eee9;border:0;border-radius:6px;padding:3px 7px;font-size:12px;color:var(--ink)}
  .row{display:flex;gap:7px;margin-top:10px}
  .b{flex:1;padding:12px 6px;border-radius:10px;border:0;font-weight:800;font-size:14px;text-align:center;text-decoration:none}
  .bw{background:var(--waze);color:#05384a}
  .bm{background:#e9e6e1;color:#333}
  .be{background:var(--ok);color:#fff;flex:1.4}
  .mini{display:flex;gap:6px;margin-top:8px}
  .mini button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:13px}
  .empty{text-align:center;color:var(--mut);padding:36px 12px;line-height:1.55}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
  .sheet{background:#fff;width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px;max-height:90vh;overflow:auto}
  .sheet h3{margin:0 0 8px}.sheet p{color:var(--mut);font-size:14px;line-height:1.45}
  .sheet textarea,.sheet input{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;font-size:15px;margin:5px 0}
  .sheet textarea{height:140px;font-size:13px}
  .sheet label{font-size:13px;color:var(--mut);display:block;margin-top:8px}
  .sb{display:flex;gap:8px;margin-top:12px}.sb button{flex:1;padding:12px;border-radius:10px;border:0;font-weight:700}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;z-index:6}
  .bar a,.bar button{flex:1;padding:13px;border-radius:12px;border:0;font-weight:800;font-size:14px;text-align:center;text-decoration:none}
  .prog{height:6px;background:#eee;border-radius:9px;overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:var(--acc);width:0}
</style>
</head>
<body>
<div class="top">
  <h1>🛵 Minha Rota <button id="bCfg">⚙️ Ajustes</button></h1>
  <div class="kpis">
    <div class="kpi"><b id="kStops">0</b><small>paradas</small></div>
    <div class="kpi"><b id="kPend">0</b><small>pacotes faltando</small></div>
    <div class="kpi"><b id="kEnt">0</b><small>entregues</small></div>
    <div class="kpi"><b id="kGanho">R$0</b><small>hoje</small></div>
  </div>
  <div class="tabs"><button class="on" data-t="rota">Rota</button><button data-t="mapa">🗺️ Mapa</button><button data-t="ent">Entregues</button></div>
</div>
<div class="wrap">
  <div class="actions" id="acts">
    <button class="act" id="bPaste">📋 Colar lista</button>
    <button class="act main" id="bCalc">🧭 Calcular melhor rota</button>
    <a class="act wz" id="bWazeNext" href="#" style="text-align:center;text-decoration:none">▶ Próxima no Waze</a>
    <button class="act gr" id="bNovo">Novo dia</button>
  </div>
  <div class="msg" id="msg"></div>
  <div id="map"></div>
  <div id="list"></div>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
const $=s=>document.querySelector(s);
const LS="minharota_v1";
let S={pkgs:[],order:[],geo:{},cfg:{cidade:"Rio Verde de Mato Grosso",uf:"MS",inicio:"Nova Rio Verde, Rio Verde de Mato Grosso, MS",valor:2.10},tab:"rota"};
try{const d=JSON.parse(localStorage.getItem(LS)||"null"); if(d) S=Object.assign(S,d,{cfg:Object.assign(S.cfg,d.cfg||{})});}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}

function norm(s){return (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase()}
function key(a){
  a=norm(a).replace(/\b(rua|r\.|avenida|av\.|av|travessa|tv\.|alameda)\s+/g,"");
  const m=a.match(/^(.*?\d+)/); return (m?m[1]:a).replace(/[^a-z0-9]+/g," ").trim();
}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function rua(a){ // "Joaquim Murtinho, 221, Igreja" -> {street:"Joaquim Murtinho", num:"221"}
  const m=(a||"").match(/^(.*?)[,\s]+(\d+)\b/); return m?{street:m[1].replace(/,$/,"").trim(),num:m[2]}:{street:(a||"").split(",")[0].trim(),num:""};
}
function msg(t){const m=$("#msg");m.style.display=t?"block":"none";m.innerHTML=t||""}
function brl(v){return "R$"+v.toFixed(2).replace(".",",")}

// ---- agrupamento: pacotes pendentes no mesmo endereço = 1 parada
function stops(status){
  const g={};
  S.pkgs.forEach((p,i)=>{ if((status==="ent")!==(p.st==="ent")) return; const k=key(p.endereco); (g[k]=g[k]||{k,idx:[]}).idx.push(i); });
  let arr=Object.values(g);
  if(status!=="ent"){
    const pos=k=>{const i=S.order.indexOf(k);return i<0?1e9:i};
    arr.sort((a,b)=>pos(a.k)-pos(b.k));
  } else arr.sort((a,b)=>Math.max(...b.idx.map(i=>S.pkgs[i].t||0))-Math.max(...a.idx.map(i=>S.pkgs[i].t||0)));
  return arr;
}
function query(p){return `${p.endereco.split(",").slice(0,2).join(",")}, ${S.cfg.cidade} - ${S.cfg.uf}`}
function wazeUrl(p){return "https://waze.com/ul?q="+encodeURIComponent(query(p))+"&navigate=yes"}
function mapsUrl(p,k){const g=S.geo[k];return "https://www.google.com/maps/dir/?api=1&travelmode=driving&destination="+(g&&g.ok?g.lat+","+g.lon:encodeURIComponent(query(p)))}

function render(){
  const pend=stops("pend"), ent=S.pkgs.filter(p=>p.st==="ent").length;
  $("#kStops").textContent=pend.length;
  $("#kPend").textContent=S.pkgs.length-ent;
  $("#kEnt").textContent=ent;
  $("#kGanho").textContent=brl(ent*(+S.cfg.valor||0));
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===S.tab));
  $("#acts").style.display=S.tab==="ent"?"none":"grid";
  $("#map").style.display=S.tab==="mapa"?"block":"none";
  if(S.tab==="mapa"){ $("#list").innerHTML=""; drawMap(pend); return; }
  const nx=pend[0]; $("#bWazeNext").href=nx?wazeUrl(S.pkgs[nx.idx[0]]):"#";
  $("#bWazeNext").style.opacity=nx?1:.4;

  const list=S.tab==="rota"?pend:stops("ent");
  if(!list.length){
    $("#list").innerHTML=S.tab==="rota"
      ? (S.pkgs.length?'<div class="empty">🎉 Tudo entregue!<br>Bom trabalho.</div>':'<div class="empty">Nenhum pacote ainda.<br>1. No <b>Leitor de Pacotes</b> (Claude), leia as fotos e toque em <b>Copiar</b>.<br>2. Aqui, toque em <b>Colar lista</b> e depois <b>Calcular rota</b>.</div>')
      : '<div class="empty">Nenhuma entrega ainda.</div>';
    return;
  }
  $("#list").innerHTML=list.map((s,n)=>{
    const p0=S.pkgs[s.idx[0]], g=S.geo[s.k], nf=g&&!g.ok;
    const pk=s.idx.map(i=>{const p=S.pkgs[i];return `<div class="pk"><span>${esc(p.destinatario||"—")}</span><button class="code" data-cp="${esc(p.codigo)}">${esc(p.codigo||"sem código")} ⧉</button></div>`}).join("");
    if(S.tab==="ent") return `<div class="stop"><div class="hd"><div class="num" style="background:var(--ok)">✓</div><div style="flex:1">
      <div class="addr">${esc(p0.endereco)}</div>${p0.bairro?`<div class="meta">${esc(p0.bairro)}</div>`:""}
      ${s.idx.length>1?`<span class="tag">${s.idx.length} pacotes</span>`:""}${pk}
      <div class="mini"><button data-undo="${s.k}">↩ Desfazer</button><button data-rme="${s.k}" style="color:#b42318">🗑 Apagar</button></div></div></div></div>`;
    return `<div class="stop ${n===0?"next":""} ${nf?"nf":""}"><div class="hd"><div class="num">${n+1}</div><div style="flex:1">
      <div class="addr">${esc(p0.endereco)}</div>${p0.bairro?`<div class="meta">${esc(p0.bairro)}</div>`:""}
      ${s.idx.length>1?`<span class="tag">⚠ ${s.idx.length} PACOTES NESTE ENDEREÇO</span>`:""}
      ${nf?`<span class="warn">não achei no mapa – posição aproximada</span>`:""}
      ${pk}</div></div>
      <div class="row"><a class="b bw" href="${wazeUrl(p0)}">Waze</a><a class="b bm" href="${mapsUrl(p0,s.k)}">Maps</a><button class="b be" data-ok="${s.k}">✓ Entregue</button></div>
      <div class="mini"><button data-up="${s.k}">▲</button><button data-dn="${s.k}">▼</button><button data-ed="${s.k}">✏️ Corrigir</button><button data-rm="${s.k}" style="color:#b42318">🗑 Apagar</button></div></div>`;
  }).join("");
}

$("#list").addEventListener("click",async e=>{
  const d=e.target.closest("button")?.dataset; if(!d) return;
  if(d.cp){ try{await navigator.clipboard.writeText(d.cp); msg("Código "+esc(d.cp)+" copiado – cole na busca do SPX para dar baixa."); setTimeout(()=>msg(""),2500);}catch(_){ } }
  if(d.ok){ S.pkgs.forEach(p=>{ if(p.st!=="ent"&&key(p.endereco)===d.ok){p.st="ent";p.t=Date.now();} }); save(); render(); window.scrollTo({top:0,behavior:"smooth"}); }
  if(d.undo){ S.pkgs.forEach(p=>{ if(p.st==="ent"&&key(p.endereco)===d.undo){p.st="";} }); save(); render(); }
  if(d.up||d.dn){ const k=d.up||d.dn; syncOrder(); const i=S.order.indexOf(k), j=d.up?i-1:i+1;
    const vis=stops("pend").map(s=>s.k); const vi=vis.indexOf(k), vj=d.up?vi-1:vi+1; if(vj<0||vj>=vis.length) return;
    const a=S.order.indexOf(vis[vi]), b=S.order.indexOf(vis[vj]); [S.order[a],S.order[b]]=[S.order[b],S.order[a]]; save(); render(); }
  if(d.ed) corrigir(d.ed);
  if(d.rm||d.rme){ const k=d.rm||d.rme, ent=!!d.rme;
    const n=S.pkgs.filter(p=>(p.st==="ent")===ent&&key(p.endereco)===k).length;
    sheet(`<h3>Apagar esta parada?</h3><p>Remove ${n} pacote(s) deste endereço da lista.</p>
      <div class="sb"><button style="background:#eee" id="rX">Cancelar</button><button style="background:#b42318;color:#fff" id="rS">Apagar</button></div>`);
    $("#rX").onclick=close_;
    $("#rS").onclick=()=>{ S.pkgs=S.pkgs.filter(p=>!((p.st==="ent")===ent&&key(p.endereco)===k)); S.order=S.order.filter(x=>x!==k); S.geom=null; save(); render(); close_(); };
  }
});
function syncOrder(){ stops("pend").forEach(s=>{ if(!S.order.includes(s.k)) S.order.push(s.k) }); }

function sheet(h){$("#sheet").innerHTML=h;$("#modal").style.display="flex"}
function close_(){$("#modal").style.display="none"}
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")close_()});

function corrigir(k){
  const idx=S.pkgs.map((p,i)=>i).filter(i=>S.pkgs[i].st!=="ent"&&key(S.pkgs[i].endereco)===k), p=S.pkgs[idx[0]];
  sheet(`<h3>Corrigir endereço</h3><label>Rua e número</label><input id="cE" value="${esc(p.endereco)}"><label>Bairro</label><input id="cB" value="${esc(p.bairro)}">
   <p>Depois de corrigir, toque em <b>Calcular rota</b> de novo.</p>
   <div class="sb"><button style="background:#eee" id="cX">Cancelar</button><button style="background:var(--ok);color:#fff" id="cS">Salvar</button></div>`);
  $("#cX").onclick=close_;
  $("#cS").onclick=()=>{ idx.forEach(i=>{S.pkgs[i].endereco=$("#cE").value.trim();S.pkgs[i].bairro=$("#cB").value.trim()}); delete S.geo[k]; save(); render(); close_(); };
}

// ---- lê a lista mesmo com sujeira do copiar/colar (\[ , aspas curvas, ``` etc.)
function lerLista(t){
  let s=t.replace(/[\u201C\u201D\u201E\u2033]/g,'"').replace(/[\u2018\u2019]/g,"'")
         .replace(/```[a-z]*/gi,"").replace(/\\([\[\]_*(){}#+\-.!`~|>])/g,"$1");
  const m=s.match(/\[[\s\S]*\]/);
  if(m){ try{ const a=JSON.parse(m[0].replace(/,\s*([\]}])/g,"$1")); if(Array.isArray(a)) return a; }catch(e){} }
  const out=[]; (s.match(/\{[^{}]*\}/g)||[]).forEach(o=>{ try{ out.push(JSON.parse(o.replace(/,\s*\}/g,"}"))) }catch(e){} });
  return out;
}
// ---- colar lista vinda do Leitor (ROTA1:[...]) ou texto simples (1 endereço por linha)
$("#bPaste").onclick=async()=>{
  let clip=""; try{clip=await navigator.clipboard.readText()}catch(e){}
  sheet(`<h3>Colar lista</h3><p>Cole aqui a lista copiada do Leitor de Pacotes. Também aceita um endereço por linha.</p>
   <textarea id="pT" placeholder="Cole aqui">${esc(clip)}</textarea>
   <div class="sb"><button style="background:#eee" id="pX">Cancelar</button><button style="background:var(--ok);color:#fff" id="pS">Adicionar</button></div>`);
  $("#pX").onclick=close_;
  $("#pS").onclick=()=>{
    const t=$("#pT").value.trim(); let lista=lerLista(t);
    if(!lista.length && !/["{]/.test(t)) lista=t.split(/\n+/).map(l=>l.trim()).filter(Boolean).map(l=>({endereco:l}));
    if(!lista.length){ close_(); msg("⚠ Não consegui entender a lista colada. Copie de novo do chat, do [ até o ]."); return; }
    let n=0,d=0;
    lista.forEach(p=>{ const q={codigo:(p.codigo||"").trim(),endereco:(p.endereco||"").trim(),bairro:(p.bairro||"").trim(),destinatario:(p.destinatario||"").trim(),st:""};
      if(!q.endereco) return; if(q.codigo&&S.pkgs.some(x=>x.codigo===q.codigo)){d++;return} S.pkgs.push(q); n++; });
    S.geom=null; syncOrder(); save(); render(); close_();
    msg(`✅ ${n} pacote(s) adicionados${d?`, ${d} repetido(s) ignorados`:""}. Agora toque em <b>Calcular rota</b>.`);
  };
};

// ---- geocodificação (OpenStreetMap / Nominatim) — 1 pedido por segundo, com cache
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function nomi(params){
  const u="https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=br&accept-language=pt-BR&"+new URLSearchParams(params);
  const r=await fetch(u,{headers:{"Accept":"application/json"}}); if(!r.ok) throw new Error("mapa "+r.status);
  const j=await r.json(); await sleep(1100); return j[0]?{lat:+j[0].lat,lon:+j[0].lon}:null;
}
async function geocode(p){
  const {street,num}=rua(p.endereco), c=S.cfg.cidade, uf=S.cfg.uf;
  let g=await nomi({street:(num?num+" ":"")+street,city:c,state:uf,country:"Brasil"});
  if(!g && p.bairro) g=await nomi({q:`${street}, ${p.bairro}, ${c}, ${uf}`});
  if(!g && num) g=await nomi({street,city:c,state:uf,country:"Brasil"});
  if(!g && p.bairro) g=await nomi({q:`${p.bairro}, ${c}, ${uf}`});
  return g;
}
function hav(a,b){const R=6371,t=x=>x*Math.PI/180,dl=t(b.lat-a.lat),dn=t(b.lon-a.lon);const h=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function localTSP(start,pts){ // vizinho mais próximo + 2-opt, caminho aberto
  let rest=pts.map((_,i)=>i),cur=start,route=[];
  while(rest.length){let bi=0,bd=1e9;rest.forEach((i,j)=>{const d=hav(cur,pts[i]);if(d<bd){bd=d;bi=j}});cur=pts[rest[bi]];route.push(rest.splice(bi,1)[0])}
  const P=[start,...route.map(i=>pts[i])],D=(a,b)=>hav(P[a],P[b]);let imp=true,it=0;
  while(imp&&it++<60){imp=false;for(let i=1;i<P.length-1;i++)for(let k=i+1;k<P.length;k++){const a=D(i-1,i)+(k+1<P.length?D(k,k+1):0),b=D(i-1,k)+(k+1<P.length?D(i,k+1):0);if(b<a-1e-9){P.splice(i,k-i+1,...P.slice(i,k+1).reverse());route.splice(i-1,k-i+1,...route.slice(i-1,k).reverse());imp=true}}}
  return route;
}
function getGPS(){return new Promise(res=>{ if(!navigator.geolocation) return res(null);
  navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lon:p.coords.longitude}),()=>res(null),{enableHighAccuracy:true,timeout:12000,maximumAge:60000}); })}

let calculando=false;
$("#bCalc").onclick=async()=>{
  if(calculando) return; const pend=stops("pend"); if(!pend.length){msg("Cole a lista de pacotes primeiro.");return}
  calculando=true;
  try{
    msg("📍 Pegando sua localização…");
    let start=await getGPS(), origem="sua localização (GPS)";
    if(!start){ const k="__inicio__"+S.cfg.inicio; if(!S.geo[k]){ const g=await nomi({q:S.cfg.inicio}); S.geo[k]=g?{...g,ok:true}:{ok:false}; save(); } if(S.geo[k].ok){start=S.geo[k];origem=S.cfg.inicio} }
    const falta=pend.filter(s=>!S.geo[s.k]);
    for(let i=0;i<falta.length;i++){
      msg(`🗺️ Achando endereços no mapa: ${i+1} de ${falta.length}…<div class="prog"><i style="width:${Math.round(100*(i+1)/falta.length)}%"></i></div>`);
      const g=await geocode(S.pkgs[falta[i].idx[0]]); S.geo[falta[i].k]=g?{...g,ok:true}:{ok:false}; save();
    }
    const ok=pend.filter(s=>S.geo[s.k].ok), nf=pend.filter(s=>!S.geo[s.k].ok);
    if(!ok.length){ msg("Não consegui achar os endereços no mapa. Confira a cidade em ⚙️ Ajustes."); return; }
    if(!start) start=S.geo[ok[0].k];
    msg("🧭 Calculando a melhor ordem pelas ruas…");
    let ordem=null, km=null;
    const pts=ok.map(s=>S.geo[s.k]);
    if(pts.length<=95){
      try{
        const coords=[start,...pts].map(p=>p.lon.toFixed(6)+","+p.lat.toFixed(6)).join(";");
        const r=await fetch(`https://router.project-osrm.org/trip/v1/driving/${coords}?source=first&roundtrip=false&destination=any&overview=full&geometries=geojson`);
        const j=await r.json();
        if(j.code==="Ok"){ const wp=j.waypoints.slice(1).map((w,i)=>({i,pos:w.waypoint_index})); wp.sort((a,b)=>a.pos-b.pos); ordem=wp.map(w=>w.i); km=j.trips[0].distance/1000; S.geom=j.trips[0].geometry.coordinates.map(c=>[c[1],c[0]]); }
      }catch(e){}
    }
    let modo="pelas ruas (OSRM)";
    if(!ordem){ ordem=localTSP(start,pts); modo="por distância em linha reta"; S.geom=null; }
    S.start={lat:start.lat,lon:start.lon}; S.km=km; S.tab="mapa";
    S.order=[...ordem.map(i=>ok[i].k),...nf.map(s=>s.k)]; save(); render();
    msg(`✅ Melhor rota calculada ${modo}, saindo de ${esc(origem)}${km?` · ${km.toFixed(1).replace(".",",")} km no total`:""}.${nf.length?`<br>⚠ ${nf.length} endereço(s) não achados no mapa ficaram no fim (cinza). Toque em ✏️ para corrigir ou use ▲▼.`:""}`);
  }catch(e){ S.tab="rota"; msg("Sem internet ou o serviço de mapa não respondeu. Tente de novo em instantes. ("+esc(e.message)+")"); }
  finally{ calculando=false; }
};

document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;save();render();msg("")});

// ---- mapa
let MAP=null, LAYER=null;
function drawMap(pend){
  if(!window.L){ $("#map").innerHTML='<div class="empty">Não consegui carregar o mapa. Confira a internet.</div>'; return; }
  if(!MAP){ MAP=L.map("map",{zoomControl:true}); L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(MAP); }
  setTimeout(()=>MAP.invalidateSize(),50);
  if(LAYER) LAYER.remove(); LAYER=L.layerGroup().addTo(MAP);
  const b=[];
  if(S.start){ L.marker([S.start.lat,S.start.lon],{icon:L.divIcon({className:"",html:'<div class="pin me">●</div>'})}).addTo(LAYER).bindPopup("Saída"); b.push([S.start.lat,S.start.lon]); }
  const line=S.start?[[S.start.lat,S.start.lon]]:[];
  pend.forEach((s,n)=>{ const g=S.geo[s.k]; if(!g||!g.ok) return; const p=S.pkgs[s.idx[0]];
    const ll=[g.lat,g.lon]; b.push(ll); line.push(ll);
    L.marker(ll,{icon:L.divIcon({className:"",html:`<div class="pin">${n+1}</div>`})}).addTo(LAYER)
     .bindPopup(`<b>${n+1}. ${esc(p.endereco)}</b><br>${s.idx.length} pacote(s)<br><a href="${wazeUrl(p)}">Abrir no Waze</a>`); });
  if(S.geom && S.geom.length) L.polyline(S.geom,{color:"#e8541c",weight:5,opacity:.8}).addTo(LAYER);
  else if(line.length>1) L.polyline(line,{color:"#e8541c",weight:4,dashArray:"6 8"}).addTo(LAYER);
  if(b.length) MAP.fitBounds(b,{padding:[30,30]}); else MAP.setView([-18.92,-54.84],14);
  const semMapa=pend.filter(s=>!S.geo[s.k]).length;
  if(!S.order.length || semMapa) msg((semMapa?`${semMapa} parada(s) ainda não estão no mapa. `:"")+"Toque em <b>Calcular melhor rota</b> para achar todos os endereços e traçar o caminho.");
}

$("#bNovo").onclick=()=>{
  sheet(`<h3>Começar um novo dia?</h3><p>Apaga a lista de hoje (pendentes e entregues). Os endereços já achados no mapa ficam guardados para ir mais rápido nos próximos dias.</p>
  <div class="sb"><button style="background:#eee" id="nX">Cancelar</button><button style="background:#b42318;color:#fff" id="nS">Apagar lista</button></div>`);
  $("#nX").onclick=close_; $("#nS").onclick=()=>{S.pkgs=[];S.order=[];S.geom=null;S.tab="rota";save();render();close_();msg("")};
};
$("#bCfg").onclick=()=>{
  sheet(`<h3>Ajustes</h3>
   <label>Cidade</label><input id="aC" value="${esc(S.cfg.cidade)}">
   <label>Estado (sigla)</label><input id="aU" value="${esc(S.cfg.uf)}">
   <label>Ponto de partida (usado se o GPS não funcionar)</label><input id="aI" value="${esc(S.cfg.inicio)}">
   <label>Quanto ganho por pacote (R$)</label><input id="aV" inputmode="decimal" value="${String(S.cfg.valor).replace(".",",")}">
   <div class="sb"><button style="background:#eee" id="aX">Cancelar</button><button style="background:var(--ok);color:#fff" id="aS">Salvar</button></div>`);
  $("#aX").onclick=close_;
  $("#aS").onclick=()=>{S.cfg={cidade:$("#aC").value.trim(),uf:$("#aU").value.trim(),inicio:$("#aI").value.trim(),valor:parseFloat($("#aV").value.replace(",","."))||0};save();render();close_()};
};
$("#bWazeNext").addEventListener("click",e=>{ if($("#bWazeNext").getAttribute("href")==="#") e.preventDefault(); });
render();
</script>
