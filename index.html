<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e8541c">
<title>Minha Rota</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --bg:#f3f1ee;--card:#ffffff;--card2:#f7f5f2;--ink:#16141a;--mut:#77716b;--line:#e8e3dd;
    --acc:#ff5a1f;--acc2:#ff8a3d;--accsoft:#fff0e8;--acctext:#b33a0b;
    --ok:#16a34a;--oksoft:#e8f7ee;--waze:#33ccff;--wazeink:#04384b;
    --warnbg:#fff6d6;--red:#b42318;--warnink:#7a5a00;--head:#17151c;--shadow:0 1px 2px rgba(20,16,12,.06),0 6px 18px rgba(20,16,12,.07);
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0f0e12;--card:#1b1920;--card2:#24212a;--ink:#f3f1f6;--mut:#a39dab;--line:#2e2a35;
    --accsoft:#3a1f14;--red:#ff8577;--acctext:#ffb08a;--oksoft:#12301f;--warnbg:#3a3112;--warnink:#ffd76a;--head:#0a090c;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  }}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:#08070a}
  body{margin:0 auto;max-width:480px;min-height:100vh;font-family:Inter,system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);box-shadow:0 0 40px rgba(0,0,0,.5)}
  button,a{font-family:inherit;cursor:pointer}
  button:active,a.b:active,.act:active{transform:scale(.97)}
  /* cabeçalho */
  .top{position:relative;z-index:5;background:linear-gradient(160deg,var(--head) 0%,#2a1a14 140%);color:#fff;padding:14px 14px 10px;border-radius:0 0 22px 22px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .top h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.3px;display:flex;justify-content:space-between;align-items:center}
  .top h1 .logo{display:flex;align-items:center;gap:9px}
  .top h1 .logo i{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;font-style:normal;font-size:18px;box-shadow:0 4px 12px rgba(255,90,31,.45)}
  .top h1 .logo small{display:block;font-size:11.5px;font-weight:600;color:#bdb6c4;letter-spacing:0;margin-top:1px}
  .top h1 button{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px 11px;font-size:13px;font-weight:600}
  .kpis{display:grid;grid-template-columns:1fr 1fr 1fr 1.25fr;gap:7px;margin:13px 0 9px}
  .kpi{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:8px 4px;text-align:center}
  .kpi b{display:block;font-size:19px;font-weight:800;letter-spacing:-.4px}
  .kpi small{font-size:10.5px;color:#bdb6c4;font-weight:600}
  .kpi.money{background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;box-shadow:0 4px 14px rgba(255,90,31,.35)}
  .kpi.money small{color:#fff;opacity:.9}
  .dayprog{height:6px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;margin:0 2px 11px}
  .dayprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22c55e,#86efac);border-radius:9px;transition:width .4s}
  .tabs{display:flex;background:rgba(255,255,255,.07);border-radius:14px;padding:4px;gap:3px}
  .tabs button{flex:1;background:none;border:0;color:#cfc8d6;padding:9px 2px;font-weight:700;font-size:12.5px;border-radius:10px;line-height:1.15}
  .tabs button.on{background:#fff;color:var(--head);box-shadow:0 2px 8px rgba(0,0,0,.2)}
  .tabs button span{color:var(--acc);font-weight:800}
  /* corpo */
  .wrap{max-width:480px;margin:0 auto;padding:14px 12px 170px}
  .actions,.emtop{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
  .act{padding:14px 8px;border-radius:14px;border:0;font-weight:700;font-size:14px;background:var(--card);color:var(--ink);box-shadow:var(--shadow);text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px}
  .act.main{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff}
  .act.wz{background:var(--waze);color:var(--wazeink)}
  .act.gr{background:var(--card2);color:var(--mut);box-shadow:none}
  .msg{background:var(--accsoft);color:var(--ink);border:1px solid rgba(255,90,31,.25);border-radius:14px;padding:12px;font-size:14px;margin:8px 0;display:none;line-height:1.45}
  #map{height:62vh;border-radius:18px;border:1px solid var(--line);display:none;margin-top:6px;box-shadow:var(--shadow)}
  .pin{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:2px solid #fff;border-radius:50%;width:28px!important;height:28px!important;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;box-shadow:0 2px 6px rgba(0,0,0,.45)}
  .pin.me{background:#2563eb}.pin.nf{background:#999}
  /* cabeçalho de rua */
  .ruah{position:sticky;top:6px;box-shadow:0 4px 12px rgba(0,0,0,.12);z-index:3;margin:18px 0 8px;padding:10px 12px;background:var(--card2);border-radius:14px;border-left:4px solid var(--acc);display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;font-size:14.5px;text-transform:uppercase;letter-spacing:.2px;color:var(--ink)}
  .ruah .rt{display:flex;flex-direction:column;gap:2px}
  .ruah small{font-weight:600;text-transform:none;color:var(--mut);font-size:12px;letter-spacing:0}
  .ruah button{font-size:12.5px;font-weight:800;text-transform:none;letter-spacing:0;border:0;border-radius:10px;padding:8px 11px;background:var(--ink);color:var(--bg);white-space:nowrap}
  .ruah button.out{background:var(--line);color:var(--ink)}
  /* cartão de parada */
  .stop{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0;box-shadow:var(--shadow)}
  .stop.next{border:2px solid var(--acc);box-shadow:0 6px 22px rgba(255,90,31,.22)}
  .stop.next::before{content:"PRÓXIMA";position:absolute;top:-10px;right:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.8px;padding:3px 9px;border-radius:999px}
  .hd{display:flex;gap:12px;align-items:flex-start}
  .hd>div{min-width:0}
  .num{flex:0 0 36px;height:36px;border-radius:12px;background:var(--accsoft);color:var(--acctext);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
  .stop.next .num{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
  .stop.nf .num{background:var(--card2);color:var(--mut)}
  .addr{font-weight:800;font-size:17px;line-height:1.25;letter-spacing:-.2px}
  .comp{color:var(--mut);font-size:13.5px;margin-top:2px;line-height:1.3}
  .meta{color:var(--mut);font-size:12.5px;margin-top:3px}
  .tag{display:inline-block;background:var(--accsoft);color:var(--acctext);border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:800;margin-top:7px}
  .warn{display:inline-block;background:var(--warnbg);color:var(--warnink);border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:600;margin-top:7px}
  .pk{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--mut);padding:7px 0 0;border-top:1px solid var(--line);margin-top:9px}
  .pk span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .code{font-family:ui-monospace,Menlo,monospace;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:11.5px;color:var(--ink);white-space:nowrap;flex-shrink:0}
  .row{display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:7px;margin-top:12px}
  .b{padding:13px 6px;border-radius:13px;border:0;font-weight:800;font-size:14px;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center}
  .bw{background:var(--waze);color:var(--wazeink)}
  .bm{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
  .be{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;font-size:15px;box-shadow:0 4px 12px rgba(22,163,74,.3)}
  .mini{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
  .mini button{border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:10px;padding:6px 11px;font-size:12.5px;font-weight:600}
  .empty{text-align:center;color:var(--mut);padding:40px 16px;line-height:1.6;font-size:15px}
  /* janelas */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:20}
  .sheet{background:var(--card);color:var(--ink);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:20px 18px 24px;max-height:90vh;overflow:auto}
  .sheet::before{content:"";display:block;width:42px;height:5px;border-radius:9px;background:var(--line);margin:-8px auto 14px}
  .sheet h3{margin:0 0 8px;font-size:18px}.sheet p{color:var(--mut);font-size:14px;line-height:1.45}
  .sheet textarea,.sheet input{width:100%;border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:12px;padding:11px;font-size:15px;margin:5px 0;font-family:inherit}
  .sheet textarea{height:140px;font-size:13px}
  .sheet label{font-size:12.5px;color:var(--mut);display:block;margin-top:10px;font-weight:600}
  .sb{display:flex;gap:8px;margin-top:14px}.sb button{flex:1;padding:13px;border-radius:13px;border:0;font-weight:700;font-size:14.5px}
  .prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:var(--acc);width:0}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="top">
  <h1><span class="logo"><i>🛵</i><span>Minha Rota<small id="kSub">Nova Rio Verde</small></span></span><button id="bCfg">⚙️ Ajustes</button></h1>
  <div class="kpis">
    <div class="kpi"><b id="kStops">0</b><small>paradas</small></div>
    <div class="kpi"><b id="kPend">0</b><small>faltando</small></div>
    <div class="kpi"><b id="kEnt">0</b><small>entregues</small></div>
    <div class="kpi money"><b id="kGanho">R$0</b><small>ganho hoje</small></div>
  </div>
  <div class="dayprog"><i id="kBar"></i></div>
  <div class="tabs"><button class="on" data-t="rota">Rota</button><button data-t="emrota">🚚 Em Rota <span id="kAtv"></span></button><button data-t="mapa">🗺️ Mapa</button><button data-t="ent">Entregues</button></div>
</div>
<div class="wrap">
  <div class="actions" id="acts">
    <button class="act" id="bPaste">📋 Colar lista</button>
    <button class="act main" id="bCalc">🧭 Calcular melhor rota</button>
    <a class="act wz" id="bWazeNext" href="#" style="text-align:center;text-decoration:none">▶ Próxima no Waze</a>
    <button class="act gr" id="bNovo">Novo dia</button>
  </div>
  <div class="msg" id="msg"></div>
  <div id="map"></div>
  <div id="list"></div>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
const $=s=>document.querySelector(s);
const LS="minharota_v1";
let S={pkgs:[],order:[],geo:{},cfg:{cidade:"Rio Verde de Mato Grosso",uf:"MS",inicio:"Nova Rio Verde, Rio Verde de Mato Grosso, MS",bairro:"Nova Rio Verde",valor:2.10},tab:"rota"};
try{const d=JSON.parse(localStorage.getItem(LS)||"null"); if(d) S=Object.assign(S,d,{cfg:Object.assign(S.cfg,d.cfg||{})}); if(S.cfg.bairro===undefined) S.cfg.bairro="Nova Rio Verde";}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
setTimeout(()=>{ registrarRuas(); let mud=false; S.pkgs.forEach(p=>{ if(p.orig===undefined){ p.orig=p.endereco; p.endereco=numFix(p.endereco); mud=true; } }); if(mud){ S.order=agruparRuas(S.order.filter(Boolean)); save(); render(); } },0);

function norm(s){return (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase()}
// ---- ruas com número: "XV de Novembro"/"Sete de Setembro" -> "15 de Novembro"/"7 de Setembro"
const NUMS={um:1,uma:1,primeiro:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12,treze:13,catorze:14,quatorze:14,quinze:15,dezesseis:16,dezessete:17,dezoito:18,dezenove:19,vinte:20,trinta:30};
const MESES="janeiro|fevereiro|marco|março|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro";
function romano(s){ if(!/^[ivxl]+$/i.test(s)) return 0; const v={i:1,v:5,x:10,l:50}; let t=0; s=s.toLowerCase();
  for(let i=0;i<s.length;i++){ const a=v[s[i]], b=v[s[i+1]]||0; t+= a<b?-a:a; } return t>0&&t<=40?t:0; }
function palavra(w){ // "vinte e um" já juntado como "vinte e um"
  const p=norm(w).split(/\s+e\s+/); let t=0; for(const x of p){ if(NUMS[x]==null) return 0; t+=NUMS[x]; } return t; }
function numFix(a){
  if(!a) return a;
  const PRE="^((?:rua|r\\.|avenida|av\\.?|travessa|tv\\.|alameda|pra[cç]a)\\s+)?";
  const NW="(vinte(?:\\s+e\\s+\\S+)?|trinta(?:\\s+e\\s+\\S+)?|[a-zçêé]+|[ivxl]+)";
  const re=new RegExp(PRE+NW+"(?=\\s+(?:de\\s+)?(?:"+MESES+")\\b|\\s*,|\\s+\\d|\\s*$)","i");
  return a.replace(re,(m,pre,w)=>{ const n=palavra(w)||romano(w); if(!n) return m; return (pre||"")+n; })
          .replace(/^((?:\S+\s+)?\d{1,2})\s+(janeiro|fevereiro|mar[cç]o|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)\b/i,"$1 de $2");
}
// nome da rua "limpo" (sem Rua/Av, sem de/da/do, sem acento)
function baseRua(s){ return norm(s).replace(/\b(rua|r\.|avenida|av\.|av|travessa|tv\.|alameda|praca)\s+/g,"").replace(/[^a-z0-9]+/g," ").split(" ").filter(w=>w&&!["de","da","do","dos","das","e"].includes(w)).join(" "); }
function lev(a,b){ const m=a.length,n=b.length; if(Math.abs(m-n)>2) return 9; let p=[...Array(n+1).keys()];
  for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
function tokIgual(a,b){ if(a===b) return true; if(/\d/.test(a)||/\d/.test(b)) return false; const L=Math.max(a.length,b.length); return lev(a,b) <= (L<=5?1:2); }
function mesmaRua(a,b){ // "geni makert" ~ "geni mackert lima", "genir marcket lima" ~ "geni mackert lima"
  const A=a.split(" "), B=b.split(" "); const [c,l]=A.length<=B.length?[A,B]:[B,A];
  if(c.length<l.length && c.length<2) return false;
  return c.every((t,i)=>tokIgual(t,l[i]));
}
// junta ruas escritas de jeitos diferentes; o mapa fica salvo para a ordem não mudar
function registrarRuas(){
  S.canon=S.canon||{}; const canon=S.canon;
  const novos=[...new Set(S.pkgs.map(p=>baseRua(rua(p.endereco).street)))].filter(b=>b&&!(b in canon))
    .sort((x,y)=>y.split(" ").length-x.split(" ").length||y.length-x.length);
  for(const b of novos){ const alvo=[...new Set(Object.values(canon))].find(c=>mesmaRua(b,c)); canon[b]=alvo||b; }
}
function streetKey(s){ const b=baseRua(s); return (S.canon&&S.canon[b])||b; }
function key(a){ const r=rua(a); return (streetKey(r.street)+" "+r.num).trim(); }
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function rua(a){ // "7 de Setembro, 221, Igreja" -> {street:"7 de Setembro", num:"221"}
  a=(a||"").trim(); const parts=a.split(",").map(x=>x.trim());
  if(parts.length>1){
    let st=parts[0], num="";
    const tail=st.match(/^(.+?)\s+(\d+)$/); if(tail && !/\sde$/i.test(tail[1]) && !/^(rua|r\.|avenida|av\.?|travessa|tv\.|alameda|pra[cç]a)$/i.test(tail[1].trim())){ st=tail[1]; num=tail[2]; }
    else { const n=(parts[1].match(/^(?:n[º°o.]?\s*)?(\d+)/i)||[])[1]; if(n) num=n; }
    return {street:st,num};
  }
  const m=a.match(/^(.+?)\s+(?:n[º°o.]?\s*)?(\d+)\b(?!\s*de\b)/i);
  return m?{street:m[1].trim(),num:m[2]}:{street:a,num:""};
}
function ruaDe(k){ for(const p of S.pkgs) if(key(p.endereco)===k) return streetKey(rua(p.endereco).street); return k; }
// junta as casas da mesma rua, mantendo a ordem em que a rua aparece primeiro na rota
function agruparRuas(keys){
  const ordemRua=[], grupos={};
  keys.forEach(k=>{ const r=ruaDe(k); if(!grupos[r]){grupos[r]=[];ordemRua.push(r)} grupos[r].push(k); });
  return ordemRua.flatMap(r=>grupos[r]);
}
function msg(t){const m=$("#msg");m.style.display=t?"block":"none";m.innerHTML=t||""}
function brl(v){return "R$"+v.toFixed(2).replace(".",",")}

// ---- agrupamento: pacotes pendentes no mesmo endereço = 1 parada
function stops(status){
  const g={};
  S.pkgs.forEach((p,i)=>{ if((status==="ent")!==(p.st==="ent")) return;
    if(status==="plan"&&p.ativo) return; if(status==="ativo"&&!p.ativo) return; const k=key(p.endereco); (g[k]=g[k]||{k,idx:[]}).idx.push(i); });
  let arr=Object.values(g);
  if(status!=="ent"){
    const pos=k=>{const i=S.order.indexOf(k);return i<0?1e9:i};
    arr.sort((a,b)=>pos(a.k)-pos(b.k));
  } else arr.sort((a,b)=>Math.max(...b.idx.map(i=>S.pkgs[i].t||0))-Math.max(...a.idx.map(i=>S.pkgs[i].t||0)));
  return arr;
}
function query(p){const b=p.bairro||S.cfg.bairro; return `${p.endereco.split(",").slice(0,2).join(",")}${b?", "+b:""}, ${S.cfg.cidade} - ${S.cfg.uf}`}
function wazeUrl(p){ const g=S.geo[key(p.endereco)];
  if(g&&g.ok&&!g.fora) return `https://waze.com/ul?ll=${g.lat.toFixed(6)},${g.lon.toFixed(6)}&navigate=yes`;
  return "https://waze.com/ul?q="+encodeURIComponent(query(p))+"&navigate=yes"; }
function mapsUrl(p,k){const g=S.geo[k];return "https://www.google.com/maps/dir/?api=1&travelmode=driving&destination="+(g&&g.ok?g.lat+","+g.lon:encodeURIComponent(query(p)))}

function addrHTML(e){ const p=(e||"").split(","); const main=p.slice(0,2).join(",").trim(), comp=p.slice(2).join(",").trim();
  return `<div class="addr">${esc(main)}</div>${comp?`<div class="comp">${esc(comp)}</div>`:""}`; }
function cardRota(s,n,primeiro){
  const p0=S.pkgs[s.idx[0]], semMapa=(S.semMapa||[]).includes(ruaDe(s.k));
  const pk=s.idx.map(i=>{const p=S.pkgs[i];return `<div class="pk"><span>${esc(p.destinatario||"—")}</span><button class="code" data-cp="${esc(p.codigo)}">${esc(p.codigo||"sem código")} ⧉</button></div>`}).join("");
  return `<div class="stop ${primeiro?"next":""} ${semMapa?"nf":""}" id="st-${n}"><div class="hd"><div class="num">${n+1}</div><div style="flex:1">
      ${addrHTML(p0.endereco)}${p0.bairro?`<div class="meta">${esc(p0.bairro)}</div>`:""}
      ${s.idx.length>1?`<span class="tag">⚠ ${s.idx.length} PACOTES NESTE ENDEREÇO</span>`:""}
      ${semMapa&&!(S.geo[s.k]&&S.geo[s.k].fora)?`<span class="warn">rua não achada no mapa</span>`:""}
      ${(()=>{const g=S.geo[s.k];return g&&g.ok&&g.fora?`<span class="warn">⚠ o mapa achou essa rua fora do bairro – ficou no fim, confira</span>`:""})()}
      ${pk}</div></div>

}

// ---- lê a lista mesmo com sujeira do copiar/colar (\[ , aspas curvas, ``` etc.)
function lerLista(t){
  let s=t.replace(/[\u201C\u201D\u201E\u2033]/g,'"').replace(/[\u2018\u2019]/g,"'")
         .replace(/```[a-z]*/gi,"").replace(/\\([\[\]_*(){}#+\-.!`~|>])/g,"$1");
  const m=s.match(/\[[\s\S]*\]/);
  if(m){ try{ const a=JSON.parse(m[0].replace(/,\s*([\]}])/g,"$1")); if(Array.isArray(a)) return a; }catch(e){} }
  const out=[]; (s.match(/\{[^{}]*\}/g)||[]).forEach(o=>{ try{ out.push(JSON.parse(o.replace(/,\s*\}/g,"}"))) }catch(e){} });
  return out;
}

// ---- geocodificação (OpenStreetMap / Nominatim) — 1 pedido por segundo, com cache, só dentro da cidade
const GEOV=3; if(S.geov!==GEOV){ S.geo={}; S.geov=GEOV; save(); }
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const TIPOS_OK=["road","house","building","residential","street","house_number"];
async function nomiRaw(params){
  const u="https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&addressdetails=0&countrycodes=br&accept-language=pt-BR&"+new URLSearchParams(params);
  const r=await fetch(u,{headers:{"Accept":"application/json"}}); if(!r.ok) throw new Error("mapa "+r.status);
  const j=await r.json(); await sleep(1100); return j;
}
let CIDADE=null;
async function cidade(){
  if(CIDADE) return CIDADE;
  const k="__cidade__"+S.cfg.cidade+"|"+S.cfg.uf;
  if(!S.geo[k]){ const j=await nomiRaw({city:S.cfg.cidade,state:S.cfg.uf,country:"Brasil"}); S.geo[k]=j[0]?{lat:+j[0].lat,lon:+j[0].lon,ok:true}:{ok:false}; save(); }
  return CIDADE=S.geo[k].ok?S.geo[k]:null;
}
let AREA="cidade", BAIRRO=null;
async function bairroBox(){ // retângulo em volta do bairro da rota (com uma folga de ~600 m)
  if(!S.cfg.bairro) return null; if(BAIRRO) return BAIRRO;
  const k="__bairro__"+S.cfg.bairro+"|"+S.cfg.cidade;
  if(!S.geo[k]){ const j=await nomiRaw({q:`${S.cfg.bairro}, ${S.cfg.cidade}, ${S.cfg.uf}`}); const x=j.find(r=>r.boundingbox);
    if(x){ let [s,n,w,e]=x.boundingbox.map(Number); const cy=(s+n)/2, cx=(w+e)/2, hy=Math.max((n-s)/2+0.006,0.0125), hx=Math.max((e-w)/2+0.006,0.0125);
      S.geo[k]={ok:true,s:cy-hy,n:cy+hy,w:cx-hx,e:cx+hx}; } else S.geo[k]={ok:false}; save(); }
  return BAIRRO=S.geo[k].ok?S.geo[k]:null;
}
async function nomi(params){ // AREA "bairro": só dentro do bairro; "cidade": até ~12 km do centro
  const C=await cidade(), B=AREA==="bairro"?await bairroBox():null;
  if(AREA==="bairro"&&!B) return null;
  if(B) params=Object.assign({viewbox:[B.w,B.n,B.e,B.s].join(","),bounded:1},params);
  else if(C) params=Object.assign({viewbox:[C.lon-0.11,C.lat+0.11,C.lon+0.11,C.lat-0.11].join(","),bounded:1},params);
  const j=await nomiRaw(params);
  for(const x of j){
    const t=x.addresstype||x.type; if(!TIPOS_OK.includes(t) && x.category!=="highway" && x.class!=="highway") continue;
    const g={lat:+x.lat,lon:+x.lon,prec:(t==="road"||x.category==="highway"||x.class==="highway")?"rua":"casa"};
    if(C && hav(C,g)>13) continue;
    return g;
  }
  return null;
}
async function geocode2(p){
  const g1=await geocode1(p,p.endereco); if(g1) return g1;
  if(p.orig && p.orig!==p.endereco) return await geocode1(p,p.orig);
  return null;
}
async function geocode(p){ // 1º tenta dentro do bairro da rota; só se não achar, procura na cidade e avisa
  try{ const B=await bairroBox();
       if(B){ AREA="bairro"; const g=await geocode2(p); if(g) return g; }
       AREA="cidade"; const g2=await geocode2(p); if(g2 && B) g2.fora=true; return g2; }
  finally{ AREA="cidade"; }
}
async function geocode1(p,end){
  const {street,num}=rua(end), c=S.cfg.cidade, uf=S.cfg.uf;
  const st=/^(rua|r\.|avenida|av\.?|travessa|tv\.|alameda|pra[cç]a)\s/i.test(street)?street:"Rua "+street;
  let g=num?await nomi({street:num+" "+st,city:c,state:uf,country:"Brasil"}):null;
  if(!g) g=await nomi({street:st,city:c,state:uf,country:"Brasil"});
  if(!g && st!==street) g=await nomi({street,city:c,state:uf,country:"Brasil"});
  if(!g && p.bairro) g=await nomi({q:`${street}, ${p.bairro}, ${c}, ${uf}`});
  return g; // não usa mais o centro do bairro: isso empilhava paradas e bagunçava a rota
}
function hav(a,b){const R=6371,t=x=>x*Math.PI/180,dl=t(b.lat-a.lat),dn=t(b.lon-a.lon);const h=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function localTSP(start,pts){ // vizinho mais próximo + 2-opt, caminho aberto
  let rest=pts.map((_,i)=>i),cur=start,route=[];
  while(rest.length){let bi=0,bd=1e9;rest.forEach((i,j)=>{const d=hav(cur,pts[i]);if(d<bd){bd=d;bi=j}});cur=pts[rest[bi]];route.push(rest.splice(bi,1)[0])}
  const P=[start,...route.map(i=>pts[i])],D=(a,b)=>hav(P[a],P[b]);let imp=true,it=0;
  while(imp&&it++<60){imp=false;for(let i=1;i<P.length-1;i++)for(let k=i+1;k<P.length;k++){const a=D(i-1,i)+(k+1<P.length?D(k,k+1):0),b=D(i-1,k)+(k+1<P.length?D(i,k+1):0);if(b<a-1e-9){P.splice(i,k-i+1,...P.slice(i,k+1).reverse());route.splice(i-1,k-i+1,...route.slice(i-1,k).reverse());imp=true}}}
  return route;
}
function getGPS(){return new Promise(res=>{ if(!navigator.geolocation) return res(null);
  navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lon:p.coords.longitude}),()=>res(null),{enableHighAccuracy:true,timeout:12000,maximumAge:60000}); })}

let calculando=false;
async function ordenar(start,pts){ // retorna {ordem,km,geom,modo}
  if(pts.length<=95){
    try{
      const coords=[start,...pts].map(p=>p.lon.toFixed(6)+","+p.lat.toFixed(6)).join(";");
      const r=await fetch(`https://router.project-osrm.org/trip/v1/driving/${coords}?source=first&roundtrip=false&destination=any&overview=full&geometries=geojson`);
      const j=await r.json();
      if(j.code==="Ok"){ const wp=j.waypoints.slice(1).map((w,i)=>({i,pos:w.waypoint_index})); wp.sort((a,b)=>a.pos-b.pos);
        return {ordem:wp.map(w=>w.i),km:j.trips[0].distance/1000,geom:j.trips[0].geometry.coordinates.map(c=>[c[1],c[0]]),modo:"pelas ruas"}; }
    }catch(e){}
  }
  return {ordem:localTSP(start,pts),km:null,geom:null,modo:"em linha reta"};
}
$("#bCalc").onclick=async()=>{
  if(calculando) return; const pend=stops("pend"); if(!pend.length){msg("Cole a lista de pacotes primeiro.");return}
  calculando=true;
  try{
    msg("📍 Pegando sua localização…");
    const C=await cidade();
    let start=await getGPS(), origem="sua localização (GPS)";
    if(start && C && hav(C,start)>40) start=null; // GPS longe da cidade: ignora
    if(!start){ const k="__inicio__"+S.cfg.inicio; if(!S.geo[k]){ const j=await nomiRaw({q:S.cfg.inicio}); S.geo[k]=j[0]?{lat:+j[0].lat,lon:+j[0].lon,ok:true}:{ok:false}; save(); } if(S.geo[k].ok){start=S.geo[k];origem=S.cfg.inicio} }
    const falta=pend.filter(s=>!S.geo[s.k]);
    for(let i=0;i<falta.length;i++){
      msg(`🗺️ Achando endereços no mapa: ${i+1} de ${falta.length}…<div class="prog"><i style="width:${Math.round(100*(i+1)/falta.length)}%"></i></div>`);
      const g=await geocode(S.pkgs[falta[i].idx[0]]); S.geo[falta[i].k]=g?{...g,ok:true}:{ok:false}; save();
    }
    // pontos fora do bairro não entram na rota. Se o bairro não está no mapa, descarta os que ficaram longe do grupo
    if(!(await bairroBox())){
      const ps=pend.map(s=>S.geo[s.k]).filter(g=>g&&g.ok);
      if(ps.length>=4){ const med=a=>{const b=[...a].sort((x,y)=>x-y);return b[Math.floor(b.length/2)]};
        const M={lat:med(ps.map(g=>g.lat)),lon:med(ps.map(g=>g.lon))};
        ps.forEach(g=>{ g.fora = hav(M,g)>2.5; }); save(); }
    }
    // agrupa por rua: cada rua vira um ponto (média das casas achadas)
    const ruas={}; pend.forEach(s=>{ const r=ruaDe(s.k); (ruas[r]=ruas[r]||{r,stops:[]}).stops.push(s); });
    const L=Object.values(ruas);
    L.forEach(R=>{ const gs=R.stops.map(s=>S.geo[s.k]).filter(g=>g&&g.ok&&!g.fora); R.pt=gs.length?{lat:gs.reduce((a,g)=>a+g.lat,0)/gs.length,lon:gs.reduce((a,g)=>a+g.lon,0)/gs.length}:null; });
    const okR=L.filter(R=>R.pt), nfR=L.filter(R=>!R.pt);
    if(!okR.length){ msg("Não consegui achar as ruas no mapa. Confira a cidade em ⚙️ Ajustes."); return; }
    if(!start) start=okR[0].pt;
    msg("🧭 Calculando a melhor ordem das ruas…");
    const res=await ordenar(start,okR.map(R=>R.pt));
    // dentro de cada rua: casas em ordem de número, no sentido de quem chega
    const nnum=s=>{ const n=parseInt(rua(S.pkgs[s.idx[0]].endereco).num,10); return isNaN(n)?1e9:n; };
    let prev=start; const final=[];
    for(const R of [...res.ordem.map(i=>okR[i]),...nfR]){
      const st=[...R.stops].sort((a,b)=>nnum(a)-nnum(b));
      const a=S.geo[st[0].k], b=S.geo[st[st.length-1].k];
      if(st.length>1 && a&&a.ok&&a.prec==="casa" && b&&b.ok&&b.prec==="casa" && hav(prev,b)<hav(prev,a)) st.reverse();
      st.forEach(s=>final.push(s.k)); if(R.pt) prev=R.pt;
    }
    S.order=final; S.geom=res.geom; S.start={lat:start.lat,lon:start.lon}; S.km=res.km; S.semMapa=nfR.map(R=>R.r); S.tab="mapa";
    save(); render();
    msg(`✅ Rota calculada ${res.modo}, saindo de ${esc(origem)}${res.km?` · ${res.km.toFixed(1).replace(".",",")} km`:""}. As casas de cada rua ficaram juntas.${nfR.length?`<br>⚠ ${nfR.length} rua(s) não achadas no mapa ficaram no fim, em cinza. Toque em ✏️ para corrigir o nome da rua ou use ▲▼.`:""}`);
  }catch(e){ S.tab="rota"; msg("Sem internet ou o serviço de mapa não respondeu. Tente de novo em instantes. ("+esc(e.message)+")"); }
  finally{ calculando=false; }
};

document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;save();render();msg("")});

// ---- mapa
let MAP=null, LAYER=null;
function drawMap(pend){
  if(!window.L){ $("#map").innerHTML='<div class="empty">Não consegui carregar o mapa. Confira a internet.</div>'; return; }
  if(!MAP){ MAP=L.map("map",{zoomControl:true}); L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(MAP); }
  setTimeout(()=>MAP.invalidateSize(),50);
  if(LAYER) LAYER.remove(); LAYER=L.layerGroup().addTo(MAP);
  const b=[];
  if(S.start){ L.marker([S.start.lat,S.start.lon],{icon:L.divIcon({className:"",html:'<div class="pin me">●</div>'})}).addTo(LAYER).bindPopup("Saída"); b.push([S.start.lat,S.start.lon]); }
  const line=S.start?[[S.start.lat,S.start.lon]]:[];
  pend.forEach((s,n)=>{ const g=S.geo[s.k]; if(!g||!g.ok||g.fora) return; const p=S.pkgs[s.idx[0]];
    const ll=[g.lat,g.lon]; b.push(ll); line.push(ll);
    L.marker(ll,{icon:L.divIcon({className:"",html:`<div class="pin">${n+1}</div>`})}).addTo(LAYER)
     .bindPopup(`<b>${n+1}. ${esc(p.endereco)}</b><br>${s.idx.length} pacote(s)<br><a href="${wazeUrl(p)}">Abrir no Waze</a>`); });
  if(S.geom && S.geom.length) L.polyline(S.geom,{color:"#e8541c",weight:5,opacity:.8}).addTo(LAYER);
  else if(line.length>1) L.polyline(line,{color:"#e8541c",weight:4,dashArray:"6 8"}).addTo(LAYER);
  if(b.length) MAP.fitBounds(b,{padding:[30,30]}); else MAP.setView([-18.92,-54.84],14);
  const semMapa=pend.filter(s=>!S.geo[s.k]).length;
  if(!S.order.length || semMapa) msg((semMapa?`${semMapa} parada(s) ainda não estão no mapa. `:"")+"Toque em <b>Calcular melhor rota</b> para achar todos os endereços e traçar o caminho.");
}

$("#bNovo").onclick=()=>{
  sheet(`<h3>Começar um novo dia?</h3><p>Apaga a lista de hoje (pendentes e entregues). Os endereços já achados no mapa ficam guardados para ir mais rápido nos próximos dias.</p>
  <div class="sb"><button style="background:#eee" id="nX">Cancelar</button><button style="background:#b42318;color:#fff" id="nS">Apagar lista</button></div>`);
  $("#nX").onclick=close_; $("#nS").onclick=()=>{S.pkgs=[];S.order=[];S.geom=null;S.semMapa=[];S.tab="rota";save();render();close_();msg("")};
};
$("#bCfg").onclick=()=>{
  sheet(`<h3>Ajustes</h3>
   <label>Cidade</label><input id="aC" value="${esc(S.cfg.cidade)}">
   <label>Estado (sigla)</label><input id="aU" value="${esc(S.cfg.uf)}">
   <label>Bairro da rota (o app procura primeiro só dentro dele)</label><input id="aB" value="${esc(S.cfg.bairro||"")}">
   <label>Ponto de partida (usado se o GPS não funcionar)</label><input id="aI" value="${esc(S.cfg.inicio)}">
   <label>Quanto ganho por pacote (R$)</label><input id="aV" inputmode="decimal" value="${String(S.cfg.valor).replace(".",",")}">
   <div class="sb"><button style="background:#eee" id="aX">Cancelar</button><button style="background:var(--ok);color:#fff" id="aS">Salvar</button></div>`);
  $("#aX").onclick=close_;
  $("#aS").onclick=()=>{const nb=$("#aB").value.trim(); if(nb!==S.cfg.bairro){ S.geo={}; BAIRRO=null; S.geom=null; }
  S.cfg={cidade:$("#aC").value.trim(),uf:$("#aU").value.trim(),bairro:nb,inicio:$("#aI").value.trim(),valor:parseFloat($("#aV").value.replace(",","."))||0};CIDADE=null;save();render();close_()};
};
$("#bWazeNext").addEventListener("click",e=>{ if($("#bWazeNext").getAttribute("href")==="#") e.preventDefault(); });
render();
</script>
